name: build-driver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          $url = "https://go.microsoft.com/fwlink/?linkid=2307563"
          $out = "$env:TEMP\wdksetup.exe"
          curl.exe -L -f -o $out $url
          if ($LASTEXITCODE -ne 0) { throw "curl failed" }
          if (-not (Test-Path $out)) { throw "no file" }
          $bytes = [System.IO.File]::ReadAllBytes($out)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D) { throw "not a PE file" }
          $p = Start-Process -FilePath $out -ArgumentList "/quiet", "/norestart", "/features +" -Wait -PassThru -NoNewWindow
          $km = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory | Where-Object { Test-Path (Join-Path $_.FullName "km\ntddk.h") } | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $km) { throw "no ntddk.h" }
          Write-Host "WDK headers at: $($km.FullName)"

      - name: Build driver
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /kernel /GS- /O2 /W3 /c NvRmDrv.c /Fo:NvRmDrv.obj /I"C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\km" /I"C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0\shared"
          if errorlevel 1 exit /b 1
          link /nologo /DRIVER /SUBSYSTEM:NATIVE /ENTRY:DriverEntry /OUT:NvRmDrv.sys NvRmDrv.obj /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\10.0.26100.0\km\x64" ntoskrnl.lib hal.lib ntstrsafe.lib
          if errorlevel 1 exit /b 1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: NvRmDrv
          path: NvRmDrv.sys
