name: build-driver

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          Write-Host "Downloading WDK installer..."
          $url = "https://go.microsoft.com/fwlink/?linkid=2307563"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\wdksetup.exe"
          
          Write-Host "Installing WDK..."
          Start-Process -FilePath "$env:TEMP\wdksetup.exe" -ArgumentList "/quiet", "/norestart", "/features +" -Wait -NoNewWindow
          
          $km = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
                Where-Object { Test-Path (Join-Path $_.FullName "km\ntddk.h") } |
                Sort-Object Name -Descending | Select-Object -First 1
          if (-not $km) { throw "WDK install failed: no km\ntddk.h" }
          Write-Host "WDK headers at: $($km.FullName)"
          $Global:WDKVER = $km.Name

      - name: Build driver
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          for /f "delims=" %%i in ('dir /b /ad /o-n "C:\Program Files (x86)\Windows Kits\10\Include" ^| findstr /r "^10\."') do (
              if exist "C:\Program Files (x86)\Windows Kits\10\Include\%%i\km\ntddk.h" (
                  set WDKVER=%%i
                  goto :found
              )
          )
          :found
          echo Using WDK: %WDKVER%
          cl /nologo /kernel /GS- /O2 /W3 /c NvRmDrv.c ^
             /Fo:NvRmDrv.obj ^
             /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDKVER%\km" ^
             /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDKVER%\shared" ^
             /I"C:\Program Files (x86)\Windows Kits\10\Include\%WDKVER%\ucrt"
          if errorlevel 1 exit /b 1
          link /nologo /DRIVER /SUBSYSTEM:NATIVE /ENTRY:DriverEntry ^
             /OUT:NvRmDrv.sys NvRmDrv.obj ^
             /LIBPATH:"C:\Program Files (x86)\Windows Kits\10\Lib\%WDKVER%\km\x64" ^
             ntoskrnl.lib hal.lib ntstrsafe.lib
          if errorlevel 1 exit /b 1
          dir NvRmDrv.sys

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: NvRmDrv
          path: NvRmDrv.sys
