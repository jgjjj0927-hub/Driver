- name: Install WDK
        shell: pwsh
        run: |
          Write-Host "Downloading WDK installer via curl..."
          $url = "https://go.microsoft.com/fwlink/?linkid=2307563"
          $out = "$env:TEMP\wdksetup.exe"

          curl.exe -L -f -o $out $url
          if ($LASTEXITCODE -ne 0) { throw "curl failed with code $LASTEXITCODE" }

          if (-not (Test-Path $out)) { throw "file not downloaded" }
          $size = (Get-Item $out).Length
          Write-Host "Downloaded size: $size bytes"

          $bytes = [System.IO.File]::ReadAllBytes($out)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              Write-Host "First bytes: $($bytes[0..10] | ForEach-Object { $_.ToString('X2') })"
              throw "Downloaded file is not a PE executable (not MZ)"
          }
          Write-Host "File is a valid PE executable"

          Write-Host "Installing WDK..."
          $p = Start-Process -FilePath $out -ArgumentList "/quiet", "/norestart", "/features +" -Wait -PassThru -NoNewWindow
          Write-Host "Installer exit code: $($p.ExitCode)"

          $km = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
                Where-Object { Test-Path (Join-Path $_.FullName "km\ntddk.h") } |
                Sort-Object Name -Descending | Select-Object -First 1
          if (-not $km) { throw "WDK install failed: no km\ntddk.h" }
          Write-Host "WDK headers at: $($km.FullName)"
